# cPanel/EasyApache userdata include for staging.28dimensions.com
#
# This mirrors the production include at:
#   /etc/apache2/conf.d/userdata/std/2_4/dimensions/28dimensions.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/dimensions/28dimensions.com/proxy.conf
# but proxies to the staging PM2 app (port 3002, see ecosystem.config.js)
# instead of production (port 3001).
#
# Install the SAME content to BOTH locations (std and ssl) so it applies
# over plain HTTP and HTTPS:
#   /etc/apache2/conf.d/userdata/std/2_4/dimensions/staging.28dimensions.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/dimensions/staging.28dimensions.com/proxy.conf
#
# Then apply with:
#   sudo /scripts/rebuildhttpdconf
#   sudo /scripts/restartsrv_httpd

# Don't proxy ACME challenges
ProxyPass /.well-known/acme-challenge/ !

ProxyPass / http://127.0.0.1:3002/
ProxyPassReverse / http://127.0.0.1:3002/
