name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - development
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.28dimensions.com

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone application
        run: pnpm build

      - name: Prepare deployment bundle
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -a .next/standalone/. deploy/

          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            cp -a public deploy/public
          fi

          tar -C deploy -czf 28d-staging-build.tar.gz .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload staging build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp \
            -P "$DEPLOY_PORT" \
            28d-staging-build.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/dimensions/deployments/28d-staging-build.tar.gz"

      - name: Deploy staging build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail

          DEPLOY_ROOT="/home/dimensions/deployments"
          RELEASE="$DEPLOY_ROOT/staging-release"
          LIVE="/home/dimensions/public_html/staging"

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          tar \
            -xzf "$DEPLOY_ROOT/28d-staging-build.tar.gz" \
            -C "$RELEASE"

          /usr/bin/rsync -a --delete \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            "$RELEASE/" \
            "$LIVE/"

          /home/dimensions/.nvm/versions/node/v22.23.1/bin/pm2 reload 28d-staging

          /home/dimensions/.nvm/versions/node/v22.23.1/bin/pm2 status 28d-staging

          rm -f "$DEPLOY_ROOT/28d-staging-build.tar.gz"
          rm -rf "$RELEASE"
          REMOTE

      - name: Verify staging
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            https://staging.28dimensions.com/