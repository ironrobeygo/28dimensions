name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://28dimensions.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build standalone application
        run: pnpm build

      - name: Prepare deployment bundle
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -a .next/standalone/. deploy/

          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            cp -a public deploy/public
          fi

          tar -C deploy -czf 28d-production-build.tar.gz .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$DEPLOY_PORT" \
            -H "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload production build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp \
            -P "$DEPLOY_PORT" \
            28d-production-build.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/dimensions/deployments/28d-production-build.tar.gz"

      - name: Deploy production build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail

          DEPLOY_ROOT="/home/dimensions/deployments"
          RELEASE="$DEPLOY_ROOT/production-release"
          LIVE="/home/dimensions/public_html"

          PM2="/home/dimensions/.nvm/versions/node/v22.23.1/bin/pm2"

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          tar \
            -xzf "$DEPLOY_ROOT/28d-production-build.tar.gz" \
            -C "$RELEASE"

          /usr/bin/rsync -a --delete \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='.ftpquota' \
            --exclude='staging/' \
            --exclude='ecosystem.config.js' \
            "$RELEASE/" \
            "$LIVE/"

          "$PM2" reload 28d

          "$PM2" status 28d

          rm -f "$DEPLOY_ROOT/28d-production-build.tar.gz"
          rm -rf "$RELEASE"
          REMOTE

      - name: Verify production
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            https://28dimensions.com/